# Module wrapper; upstream API preserved. Policy: mcpp-index/docs/mwrap.md.
[package]
namespace = "mcpplibs.mwrap"
name = "ffmpeg"
version = "8.1.2"
description = "FFmpeg 8.1.2 C++ modules for mcpp (import mcpplibs.mwrap.ffmpeg.av;) on top of the compat.ffmpeg source build"
license = "Apache-2.0"
authors = ["mcpp-community"]
repo        = "https://github.com/mcpplibs/ffmpeg-m"
platforms   = ["linux", "macos", "windows"]

[targets.ffmpeg]
kind = "lib"

[build]
sources      = ["src/**/*.cppm"]
include_dirs = ["include"]
# FFmpeg's own CXXFLAGS carry this; common.h #errors without it in C++ TUs
# (the module wrappers include the upstream headers in their GMF).
cxxflags = ["-D__STDC_CONSTANT_MACROS"]

[dependencies]
# Upstream sources, config snapshot, and the full source-build recipe live in
# the compat.ffmpeg index package (2281 TUs incl. NASM asm, built by mcpp).
compat.ffmpeg = "8.1.2"

[target.'cfg(all(arch = "x86_64", any(os = "linux", os = "windows")))'.xlings.workspace]
# Frozen x86 FFmpeg profiles use NASM. Provision the managed assembler even
# when an unrelated NASM is present on PATH, so strict consumers are portable.
"xim:nasm" = "3.02"

[dev-dependencies]
compat.gtest = "1.15.2"


[package.metadata.mwrap]
upstream-version = "8.1.2"

[[runtime.deploy]]
from = "LICENSE"
to = "licenses/ffmpeg"

[[runtime.deploy]]
from = "NOTICE"
to = "licenses/ffmpeg"

[[runtime.deploy]]
from = "upstream/ffmpeg/README.md"
to = "licenses/ffmpeg/upstream/ffmpeg"

[[runtime.deploy]]
from = "upstream/ffmpeg/LICENSE.md"
to = "licenses/ffmpeg/upstream/ffmpeg"

[[runtime.deploy]]
from = "upstream/ffmpeg/COPYING.LGPLv2.1"
to = "licenses/ffmpeg/upstream/ffmpeg"

[[runtime.deploy]]
from = "upstream/ffmpeg/COPYING.LGPLv3"
to = "licenses/ffmpeg/upstream/ffmpeg"

[[runtime.deploy]]
from = "upstream/ffmpeg/COPYING.GPLv2"
to = "licenses/ffmpeg/upstream/ffmpeg"

[[runtime.deploy]]
from = "upstream/ffmpeg/COPYING.GPLv3"
to = "licenses/ffmpeg/upstream/ffmpeg"

[[runtime.deploy]]
from = "upstream/wrapper-legacy/LICENSE"
to = "licenses/ffmpeg/upstream/wrapper-legacy"
