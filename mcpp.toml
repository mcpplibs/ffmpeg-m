# The namespace names whose library this is, not who packaged it; the version
# says which upstream you are getting. `mcpplibs` is mcpp's DEFAULT namespace
# (kDefaultNamespace), not an answer to "whose library"; and `0.0.3` told a
# consumer nothing about which FFmpeg was inside — it is 8.1.2, which is what
# the compat.ffmpeg dependency below has said all along.
#
# Rule and full migration table: mcpp-index#163.
[package]
namespace   = "ffmpeg"
name        = "ffmpeg"
version     = "8.1.2.1"
description = "FFmpeg 8.1.2 C++ modules for mcpp (import ffmpeg.av;) on top of the compat.ffmpeg source build"
license     = "MIT"
repo        = "https://github.com/mcpplibs/ffmpeg-m"
platforms   = ["linux", "macos", "windows"]

[targets.ffmpeg]
kind = "lib"

[build]
sources      = ["src/**/*.cppm"]
include_dirs = ["include"]
# FFmpeg's own CXXFLAGS carry this; common.h #errors without it in C++ TUs
# (the module wrappers include the upstream headers in their GMF).
cxxflags = ["-D__STDC_CONSTANT_MACROS"]

[dependencies]
# Upstream sources, config snapshot, and the full source-build recipe live in
# the compat.ffmpeg index package (2281 TUs incl. NASM asm, built by mcpp).
compat.ffmpeg = "8.1.2"

[target.'cfg(all(arch = "x86_64", any(os = "linux", os = "windows")))'.xlings.workspace]
# Frozen x86 FFmpeg profiles use NASM. Provision the managed assembler even
# when an unrelated NASM is present on PATH, so strict consumers are portable.
"xim:nasm" = "3.02"

[dev-dependencies]
compat.gtest = "1.15.2"

